name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradlew'
      - '**/gradle-wrapper.properties'
      - '**/gradle/libs.versions.toml'
      - '**/gradle.properties'
      - '**/settings.gradle*'
      - '**/AndroidManifest.xml'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradlew'
      - '**/gradle-wrapper.properties'
      - '**/gradle/libs.versions.toml'
      - '**/gradle.properties'
      - '**/settings.gradle*'
      - '**/AndroidManifest.xml'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo '::error::Android SDK was not found on the runner.'
            exit 1
          fi
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDK_MANAGER" ]]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDK_MANAGER" || ! -x "$SDK_MANAGER" ]]; then
            echo '::error::Android sdkmanager was not found.'
            exit 1
          fi
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check for an Android Gradle project
        shell: bash
        run: |
          if [[ ! -f ./settings.gradle && ! -f ./settings.gradle.kts ]]; then
            echo '::error::No Gradle settings file found at the repository root.'
            exit 1
          fi
          if ! find . -path '*/src/main/AndroidManifest.xml' -print -quit | grep -q .; then
            echo '::error::No Android app manifest found. Add the Android project source before running this workflow.'
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: conversion-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
