name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradlew'
      - '**/gradle-wrapper.properties'
      - '**/gradle/libs.versions.toml'
      - '**/settings.gradle*'
      - '**/AndroidManifest.xml'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradlew'
      - '**/gradle-wrapper.properties'
      - '**/gradle/libs.versions.toml'
      - '**/settings.gradle*'
      - '**/AndroidManifest.xml'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check for an Android Gradle project
        shell: bash
        run: |
          if [[ ! -f ./gradlew ]]; then
            echo '::error::No Gradle wrapper (./gradlew) found at the repository root.'
            exit 1
          fi
          if ! find . -path '*/src/main/AndroidManifest.xml' -print -quit | grep -q .; then
            echo '::error::No Android app manifest found. Add the Android project source before running this workflow.'
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: conversion-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
